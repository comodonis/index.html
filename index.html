<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comodonis Hamburgueria - Cardápio & Pedidos</title>
  <style>
    :root {
      --primary: #990000;
      --secondary: #ffcc00;
      --dark: #1a1a1a;
      --light: #f9f9f9;
      --white: #ffffff;
      --shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: var(--light); color: var(--dark); padding-bottom: 100px; }
    header { background-color: var(--primary); color: var(--white); text-align: center; padding: 25px 15px; border-bottom: 5px solid var(--secondary); }
    header h1 { font-size: 2rem; text-transform: uppercase; margin-bottom: 5px; }
    header p { font-size: 1rem; color: var(--secondary); font-weight: bold; }
    .container { max-width: 900px; margin: 0 auto; padding: 20px 15px; }
    .section-title { font-size: 1.4rem; color: var(--primary); border-left: 5px solid var(--secondary); padding-left: 10px; margin: 30px 0 15px 0; text-transform: uppercase; font-weight: bold; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .card { background-color: var(--white); border-radius: 8px; box-shadow: var(--shadow); padding: 15px; display: flex; flex-direction: column; justify-content: space-between; }
    .card-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 8px; color: var(--primary); }
    .card-desc { font-size: 0.9rem; color: #555; margin-bottom: 15px; line-height: 1.4; flex-grow: 1; }
    .card-bottom { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #eee; padding-top: 10px; }
    .price { font-size: 1.2rem; font-weight: bold; color: #2e7d32; }
    .btn-add { background-color: var(--primary); color: var(--white); border: none; padding: 8px 14px; border-radius: 4px; font-weight: bold; cursor: pointer; }
    .btn-add:hover { background-color: #770000; }
    .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background-color: var(--dark); color: var(--white); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; }
    .btn-view-cart { background-color: var(--secondary); color: var(--dark); border: none; padding: 10px 18px; border-radius: 4px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <h1>Comodonis Hamburgueria</h1>
    <p>1ª Hamburgueria de Embu-Guaçu - Desde 2013</p>
  </header>

  <div class="container">
    <div class="section-title">Entradas e Porções</div>
    <div class="grid" id="portions-grid"></div>

    <div class="section-title">Hambúrgueres Artesanais</div>
    <div class="grid" id="burgers-grid"></div>
  </div>

  <div class="cart-bar">
    <div id="cart-summary">Seu Carrinho está vazio</div>
    <button class="btn-view-cart" onclick="sendWhatsAppOrder()">Pedir no WhatsApp</button>
  </div>

  <script>
    const WHATSAPP_NUMBER = "5511965235613";

    // LISTA DE PRODUTOS - Adicione novos itens seguindo exatamente esta estrutura
    const cardapio = [
      {
        categoria: "porcao",
        nome: "Batata Rústica",
        desc: "Porção de batatas rústicas com tempero especial da casa.",
        preco: 22.00
      },
      {
        categoria: "porcao",
        nome: "Onion Rings",
        desc: "Anéis de cebola crocantes acompanhados de molho barbecue.",
        preco: 24.00
      },
      {
        categoria: "hamburguer",
        nome: "Comodinho (Kids)",
        desc: "Burger 60g, Queijo, Alface e Molho Especial.",
        preco: 19.90
      },
      {
        categoria: "hamburguer",
        nome: "Comodonis X-Cheese Burger",
        desc: "Burger 120g, Queijo derretendo e Molho Especial.",
        preco: 29.90
      }
    ];

    let carrinho = [];

    function renderizar() {
      const portionsGrid = document.getElementById("portions-grid");
      const burgersGrid = document.getElementById("burgers-grid");

      cardapio.forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div>
            <div class="card-title">${item.nome}</div>
            <div class="card-desc">${item.desc}</div>
          </div>
          <div class="card-bottom">
            <span class="price">R$ ${item.preco.toFixed(2).replace('.', ',')}</span>
            <button class="btn-add" onclick="adicionar(${index})">Adicionar</button>
          </div>
        `;

        if (item.categoria === "porcao") {
          portionsGrid.appendChild(card);
        } else {
          burgersGrid.appendChild(card);
        }
      });
    }

    function adicionar(index) {
      carrinho.push(cardapio[index]);
      document.getElementById("cart-summary").innerText = `${carrinho.length} item(ns) no carrinho`;
    }

    function sendWhatsAppOrder() {
      if (carrinho.length === 0) {
        alert("Seu carrinho está vazio!");
        return;
      }
      let texto = "Olá, gostaria de fazer um pedido:\n\n";
      let total = 0;
      carrinho.forEach(item => {
        texto += `• ${item.nome} - R$ ${item.preco.toFixed(2).replace('.', ',')}\n`;
        total += item.preco;
      });
      texto += `\n*Total:* R$ ${total.toFixed(2).replace('.', ',')}`;
      window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(texto)}`, '_blank');
    }

    document.addEventListener("DOMContentLoaded", renderizar);
  </script>
</body>
</html>
