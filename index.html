<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comodonis Hamburgueria - Cardápio & Pedidos</title>
    <style>
        :root {
            --primary: #990000;
            --secondary: #ffcc00;
            --dark: #1a1a1a;
            --light: #f9f9f9;
            --white: #ffffff;
            --shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--light);
            color: var(--dark);
            padding-bottom: 100px;
        }
        header {
            background-color: var(--primary);
            color: var(--white);
            text-align: center;
            padding: 30px 15px;
            border-bottom: 5px solid var(--secondary);
        }
        header h1 {
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        header p {
            font-size: 1rem;
            color: var(--secondary);
            font-weight: bold;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px 15px;
        }
        .section-title {
            font-size: 1.5rem;
            color: var(--primary);
            border-left: 5px solid var(--secondary);
            padding-left: 10px;
            margin: 35px 0 15px 0;
            text-transform: uppercase;
            font-weight: bold;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: var(--white);
            border-radius: 8px;
            padding: 20px;
            box-shadow: var(--shadow);
            border: 1px solid #eee;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }
        .badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #5c3a21;
            color: var(--white);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .card-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 5px;
            color: var(--primary);
            padding-right: 90px;
        }
        .card-desc {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 15px;
            line-height: 1.4;
        }
        .custom-group {
            margin-bottom: 12px;
            border-top: 1px dashed #eee;
            padding-top: 8px;
        }
        .custom-label {
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--dark);
            margin-bottom: 5px;
            display: block;
        }
        .select-input {
            width: 100%;
            padding: 6px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 0.85rem;
            background-color: var(--white);
            margin-bottom: 8px;
        }
        .checkbox-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }
        .checkbox-label {
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }
        .card-bottom {
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }
        .price {
            font-size: 1.25rem;
            font-weight: bold;
            color: #2e7d32;
        }
        .btn-add {
            background-color: var(--primary);
            color: var(--white);
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-add:hover {
            background-color: #770000;
        }
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--dark);
            color: var(--white);
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.2);
            z-index: 1000;
        }
        .cart-info h4 {
            font-size: 1.1rem;
            color: var(--secondary);
        }
        .btn-view-cart {
            background-color: var(--secondary);
            color: var(--dark);
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 15px;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background-color: var(--white);
            width: 100%;
            max-width: 500px;
            border-radius: 8px;
            padding: 20px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: var(--shadow);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .modal-header h3 {
            color: var(--primary);
        }
        .close-modal {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            font-weight: bold;
        }
        .cart-item {
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }
        .cart-item-title {
            font-weight: bold;
            font-size: 1rem;
        }
        .cart-item-details {
            font-size: 0.8rem;
            color: #666;
            margin: 4px 0;
        }
        .cart-item-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 5px;
        }
        .qty-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-qty {
            background-color: #ddd;
            border: none;
            width: 25px;
            height: 25px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-submit-order {
            background-color: #25d366;
            color: var(--white);
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 4px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Comodonis Hamburgueria</h1>
        <p>1ª Hamburgueria de Embu-Guaçu - Desde 2013</p>
    </header>

    <div class="container">
        
        <!-- ENTRADAS E PORÇÕES -->
        <div class="section-title">Entradas e Porções</div>
        <div class="grid" id="portions-grid"></div>

        <!-- HAMBÚRGUERES -->
        <div class="section-title">Hambúrgueres Artesanais</div>
        <div class="grid" id="burgers-grid"></div>

    </div>

    <!-- BARRA FIXA DO CARRINHO -->
    <div class="cart-bar">
        <div class="cart-info">
            <h4 id="cart-summary">Seu Carrinho está vazio</h4>
        </div>
        <button class="btn-view-cart" onclick="toggleModal(true)">Ver Carrinho</button>
    </div>

    <!-- MODAL DO CARRINHO -->
    <div class="modal" id="cart-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Seu Pedido</h3>
                <button class="close-modal" onclick="toggleModal(false)">&times;</button>
            </div>
            <div id="cart-items-container"></div>
            <div style="margin-top: 20px; font-size: 1.2rem; font-weight: bold; text-align: right;" id="modal-total">
                Total: R$ 0,00
            </div>
            <button class="btn-submit-order" onclick="sendWhatsAppOrder()">
                Enviar Pedido no WhatsApp
            </button>
        </div>
    </div>
